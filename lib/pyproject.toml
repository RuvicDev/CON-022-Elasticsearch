[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ruvic-elasticsearch-connector"
version = "1.0.0"
description = "Conector Ruvic de solo lectura para Elasticsearch"
requires-python = ">=3.10"
dependencies = [
    "elasticsearch>=8.10,<9.0",
]

[tool.setuptools.packages.find]
include = ["ruvic_elasticsearch_connector*"]
